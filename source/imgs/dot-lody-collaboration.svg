<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Dot 通过 Lody CLI 协调已有 Agent</title>
  <desc id="desc">用户与 Dot 沟通目标和结果。Dot 在自己的云端执行环境中安装并使用 Lody CLI，联系已有机器上的 Agent 会话。需要独立开发环境时，可另行委派 Codex Cloud。项目负责人组织执行、质量复核与验收，任务进度对齐共同记录。图示为协作分工，不表示所有环节已自动接入。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#607988"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:34px;font-weight:700;fill:#182f40}.sub{font-size:20px;fill:#526b7a}
      .name{font-size:28px;font-weight:700;fill:#182f40}.body{font-size:20px;fill:#405d6e}
      .label{font-size:17px;fill:#526b7a}.arrow{fill:none;stroke:#607988;stroke-width:2;marker-end:url(#arrow)}
      .box{fill:#fff;stroke:#c9d7df;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="690" rx="22" fill="#f5f8fa"/>
  <text x="80" y="68" class="title">让 Dot 来派活</text>
  <text x="80" y="106" class="sub">Dot 使用 Lody CLI，连接已有机器上的 Agent 与会话</text>

  <rect class="box" x="80" y="170" width="220" height="150" rx="14"/>
  <text x="190" y="216" text-anchor="middle" class="name">你</text>
  <text x="190" y="257" text-anchor="middle" class="body">提出目标</text>
  <text x="190" y="287" text-anchor="middle" class="body">决定取舍</text>

  <rect x="430" y="170" width="330" height="150" rx="14" fill="#e1f0ed" stroke="#a8cec5" stroke-width="1.5"/>
  <text x="595" y="216" text-anchor="middle" class="name">Dot</text>
  <text x="595" y="257" text-anchor="middle" class="body">自己的云端执行环境</text>
  <text x="595" y="287" text-anchor="middle" class="body">安装并使用 Lody CLI</text>

  <rect class="box" x="890" y="170" width="230" height="150" rx="14"/>
  <text x="1005" y="216" text-anchor="middle" class="name">Lody</text>
  <text x="1005" y="257" text-anchor="middle" class="body">已有机器与 Agent</text>
  <text x="1005" y="287" text-anchor="middle" class="body">在相应会话中执行</text>

  <path class="arrow" d="M300 233 H418"/>
  <text x="365" y="217" text-anchor="middle" class="label">目标与取舍</text>
  <path class="arrow" d="M430 279 H312"/>
  <text x="365" y="306" text-anchor="middle" class="label">结果与问题</text>
  <path class="arrow" d="M760 233 H878"/>
  <text x="825" y="217" text-anchor="middle" class="label">任务与跟进</text>
  <path class="arrow" d="M890 279 H772"/>
  <text x="825" y="306" text-anchor="middle" class="label">进展与产物</text>

  <path class="arrow" d="M595 320 V390" stroke-dasharray="6 6"/>
  <text x="619" y="360" class="label">需要独立开发环境时</text>
  <rect class="box" x="430" y="400" width="330" height="105" rx="14" stroke-dasharray="6 6"/>
  <text x="595" y="442" text-anchor="middle" class="name">Codex Cloud</text>
  <text x="595" y="478" text-anchor="middle" class="body">按需创建独立云任务</text>

  <rect x="80" y="548" width="1040" height="78" rx="12" fill="#eaf0f4"/>
  <text x="600" y="580" text-anchor="middle" class="body">项目负责人组织执行、复核与验收，Dot 汇总结果</text>
  <text x="600" y="608" text-anchor="middle" class="label">任务与进展对齐共同记录，细节沿关联任务和报告展开</text>
  <text x="80" y="662" class="label">分工示意 · 按已授权范围接入 · Codex Cloud 为可选路线</text>
</svg>
