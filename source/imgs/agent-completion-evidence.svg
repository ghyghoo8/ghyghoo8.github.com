<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc">
<title id="title">从“已收到”到“可交付”</title><desc id="desc">四种事实分别核对：已收件看任务记录和接收回执；已执行看本次运行记录与实际产物；已读结果看指定结果版本的读确认；已验收看负责人按标准的确认。前三项不会自动证明下一项，验收也只覆盖本次范围。超时先核原任务，不立即重派。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect x="0" y="0" width="1200" height="1110" rx="0" fill="#f4f7f8"/>
<text x="56" y="56" font-size="21" fill="#166c68" font-weight="650" text-anchor="start">04 / AGENT COLLABORATION</text>
<text x="56" y="113" font-size="43" fill="#173047" font-weight="700" text-anchor="start">从“已收到”到“可交付”</text>
<text x="56" y="154" font-size="25" fill="#516475" font-weight="400" text-anchor="start">四种事实分别证明，状态名称本身不能代替证据。</text>
<text x="88" y="224" font-size="26" fill="#516475" font-weight="600" text-anchor="start">当前事实</text>
<text x="388" y="224" font-size="26" fill="#516475" font-weight="600" text-anchor="start">看什么证据</text>
<text x="806" y="224" font-size="26" fill="#516475" font-weight="600" text-anchor="start">边界是什么</text>
<rect x="56" y="251" width="1088" height="143" rx="18" fill="white" stroke="#d5e0e5" stroke-width="1.5"/>
<rect x="80" y="282" width="54" height="54" rx="12" fill="#516475"/>
<text x="107" y="318" font-size="25" fill="white" font-weight="650" text-anchor="middle">01</text>
<text x="158" y="317" font-size="32" fill="#516475" font-weight="650" text-anchor="start">已收件</text>
<text x="388" y="305" font-size="28" fill="#173047" font-weight="400" text-anchor="start">任务记录</text>
<text x="388" y="346" font-size="28" fill="#173047" font-weight="400" text-anchor="start">接收回执</text>
<text x="806" y="305" font-size="27" fill="#516475" font-weight="400" text-anchor="start">不证明 Agent</text>
<text x="806" y="346" font-size="27" fill="#516475" font-weight="400" text-anchor="start">已经开始工作</text>
<rect x="56" y="421" width="1088" height="143" rx="18" fill="white" stroke="#d5e0e5" stroke-width="1.5"/>
<rect x="80" y="452" width="54" height="54" rx="12" fill="#365cad"/>
<text x="107" y="488" font-size="25" fill="white" font-weight="650" text-anchor="middle">02</text>
<text x="158" y="487" font-size="32" fill="#365cad" font-weight="650" text-anchor="start">已执行</text>
<text x="388" y="475" font-size="28" fill="#173047" font-weight="400" text-anchor="start">本次运行记录</text>
<text x="388" y="516" font-size="28" fill="#173047" font-weight="400" text-anchor="start">实际产物</text>
<text x="806" y="475" font-size="27" fill="#516475" font-weight="400" text-anchor="start">不证明成果</text>
<text x="806" y="516" font-size="27" fill="#516475" font-weight="400" text-anchor="start">已经符合要求</text>
<rect x="56" y="591" width="1088" height="143" rx="18" fill="white" stroke="#d5e0e5" stroke-width="1.5"/>
<rect x="80" y="622" width="54" height="54" rx="12" fill="#166c68"/>
<text x="107" y="658" font-size="25" fill="white" font-weight="650" text-anchor="middle">03</text>
<text x="158" y="657" font-size="32" fill="#166c68" font-weight="650" text-anchor="start">已读结果</text>
<text x="388" y="645" font-size="28" fill="#173047" font-weight="400" text-anchor="start">指定版本</text>
<text x="388" y="686" font-size="28" fill="#173047" font-weight="400" text-anchor="start">读取确认</text>
<text x="806" y="645" font-size="27" fill="#516475" font-weight="400" text-anchor="start">不证明负责人</text>
<text x="806" y="686" font-size="27" fill="#516475" font-weight="400" text-anchor="start">已经认可结果</text>
<rect x="56" y="761" width="1088" height="143" rx="18" fill="white" stroke="#d5e0e5" stroke-width="1.5"/>
<rect x="80" y="792" width="54" height="54" rx="12" fill="#166c68"/>
<text x="107" y="828" font-size="25" fill="white" font-weight="650" text-anchor="middle">04</text>
<text x="158" y="827" font-size="32" fill="#166c68" font-weight="650" text-anchor="start">已验收</text>
<text x="388" y="815" font-size="28" fill="#173047" font-weight="400" text-anchor="start">负责人对照标准</text>
<text x="388" y="856" font-size="28" fill="#173047" font-weight="400" text-anchor="start">作出确认</text>
<text x="806" y="815" font-size="27" fill="#516475" font-weight="400" text-anchor="start">只覆盖本次</text>
<text x="806" y="856" font-size="27" fill="#516475" font-weight="400" text-anchor="start">明确验收的范围</text>
<rect x="56" y="966" width="1088" height="99" rx="12" fill="#e8eff3"/>
<text x="78" y="1005" font-size="25" fill="#516475" font-weight="400" text-anchor="start">遇到超时：保留“结果未知”，沿原任务核对。</text>
<text x="78" y="1040" font-size="25" fill="#516475" font-weight="400" text-anchor="start">补传同一份结果，与再次执行任务，是两种不同的动作。</text>
</svg>
