<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1310" viewBox="0 0 1200 1310" role="img" aria-labelledby="title desc">
<title id="title">先拆依赖，再安排并行</title><desc id="desc">这是示例流程，并非已验收业务。使用者明确分享会目标，负责人拆解任务；页面实现与资料整理可并行，视频制作等待页面达到可录制状态；负责人收集三类成果并核对，业务负责人按标准确认。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect x="0" y="0" width="1200" height="1310" rx="0" fill="#f4f7f8"/>
<text x="56" y="56" font-size="21" fill="#166c68" font-weight="650" text-anchor="start">03 / AGENT COLLABORATION</text>
<text x="56" y="113" font-size="43" fill="#173047" font-weight="700" text-anchor="start">先拆依赖，再安排并行</text>
<text x="56" y="154" font-size="25" fill="#516475" font-weight="400" text-anchor="start">以准备一场分享会为例：页面与资料先并行，视频按依赖接续。</text>
<rect x="220" y="197" width="760" height="110" rx="18" fill="white" stroke="#d5e0e5" stroke-width="1.5"/>
<rect x="220" y="214" width="5" height="76" rx="2" fill="#173047"/>
<text x="245" y="241" font-size="31" fill="#173047" font-weight="650" text-anchor="start">明确交付目标</text>
<text x="245" y="280" font-size="25" fill="#516475" font-weight="400" text-anchor="start">报名页面 · 讲解材料 · 演示视频</text>
<path d="M 600 314 V 354" fill="none" stroke="#166c68" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="220" y="365" width="760" height="110" rx="18" fill="white" stroke="#d5e0e5" stroke-width="1.5"/>
<rect x="220" y="382" width="5" height="76" rx="2" fill="#166c68"/>
<text x="245" y="409" font-size="31" fill="#166c68" font-weight="650" text-anchor="start">项目负责人拆解与派工</text>
<text x="245" y="448" font-size="25" fill="#516475" font-weight="400" text-anchor="start">固定输入、执行环境、写入范围和验收标准</text>
<path d="M 600 482 V 514 H 315 V 551" fill="none" stroke="#166c68" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 600 514 H 885 V 551" fill="none" stroke="#166c68" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="75" y="560" width="480" height="130" rx="18" fill="#f2f5fb" stroke="#d5e0e5" stroke-width="1.5"/>
<rect x="75" y="577" width="5" height="96" rx="2" fill="#365cad"/>
<text x="100" y="604" font-size="31" fill="#365cad" font-weight="650" text-anchor="start">页面实现</text>
<text x="100" y="643" font-size="25" fill="#516475" font-weight="400" text-anchor="start">交付：代码版本 + 自检结果</text>
<rect x="645" y="560" width="480" height="130" rx="18" fill="#eef6f4" stroke="#d5e0e5" stroke-width="1.5"/>
<rect x="645" y="577" width="5" height="96" rx="2" fill="#166c68"/>
<text x="670" y="604" font-size="31" fill="#166c68" font-weight="650" text-anchor="start">资料整理</text>
<text x="670" y="643" font-size="25" fill="#516475" font-weight="400" text-anchor="start">交付：讲稿 + 资料来源</text>
<path d="M 315 697 V 772" fill="none" stroke="#365cad" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="347" y="744" font-size="24" fill="#516475" font-weight="400" text-anchor="start">页面达到可录制状态</text>
<rect x="75" y="781" width="480" height="130" rx="18" fill="#f2f5fb" stroke="#d5e0e5" stroke-width="1.5"/>
<rect x="75" y="798" width="5" height="96" rx="2" fill="#365cad"/>
<text x="100" y="825" font-size="31" fill="#365cad" font-weight="650" text-anchor="start">演示视频</text>
<text x="100" y="864" font-size="25" fill="#516475" font-weight="400" text-anchor="start">交付：可读取的成片 + 检查说明</text>
<path d="M 315 918 V 990" fill="none" stroke="#166c68" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 885 697 V 990" fill="none" stroke="#166c68" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="220" y="1000" width="760" height="110" rx="18" fill="white" stroke="#d5e0e5" stroke-width="1.5"/>
<rect x="220" y="1017" width="5" height="76" rx="2" fill="#166c68"/>
<text x="245" y="1044" font-size="31" fill="#166c68" font-weight="650" text-anchor="start">负责人收集与核对</text>
<text x="245" y="1083" font-size="25" fill="#516475" font-weight="400" text-anchor="start">核对版本、读取成果、检查缺口，按需安排独立复核</text>
<path d="M 600 1117 V 1151" fill="none" stroke="#166c68" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="220" y="1160" width="760" height="100" rx="18" fill="white" stroke="#d5e0e5" stroke-width="1.5"/>
<rect x="220" y="1177" width="5" height="66" rx="2" fill="#173047"/>
<text x="245" y="1204" font-size="31" fill="#173047" font-weight="650" text-anchor="start">业务负责人确认</text>
<text x="245" y="1243" font-size="25" fill="#516475" font-weight="400" text-anchor="start">对照标准验收，再汇总回报</text>
<text x="600" y="1292" font-size="23" fill="#516475" font-weight="400" text-anchor="middle">示例流程 · 并行以输入明确、互不冲突、可独立检查为前提</text>
</svg>
